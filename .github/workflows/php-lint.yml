name: PHP Linting

on:
  push:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [7.4, 8.0, 8.1, 8.2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo
        tools: composer

    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Run PHPCS (show all issues)
      continue-on-error: true
      run: ./vendor/bin/phpcs --report=full

    - name: Fail on PHPCS errors (not warnings)
      run: ./vendor/bin/phpcs --warning-severity=0 --report=summary
